<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>외출 준비물 체크</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 20px;
        }

        .header-image {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .checklist {
            text-align: left;
            margin-bottom: 15px;
            max-height: 250px; 
            overflow-y: auto;
        }
        
        .item-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #eeeeee;
        }
        .item-container:last-child {
            border-bottom: none;
        }
        .checklist label {
            display: flex;
            align-items: center;
            font-size: 18px;
            margin-bottom: 0; 
            cursor: pointer;
            color: #555555;
            flex: 1; 
        }
        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            cursor: pointer;
        }
        .delete-btn {
            background-color: transparent;
            color: #999;
            border: 1px solid #ddd;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            width: auto;
            flex: none; 
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background-color: #ffebee;
            color: #d32f2f;
            border-color: #d32f2f;
        }
        
        .add-item-box {
            display: flex;
            margin-bottom: 25px;
            gap: 8px;
        }
        .add-item-box input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        .add-item-box button {
            width: auto;
            padding: 10px 15px;
            background-color: #2196F3; 
        }
        .add-item-box button:hover {
            background-color: #0b7dda;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .reset-btn {
            background-color: #f44336; 
        }
        .reset-btn:hover {
            background-color: #da190b;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 24px;
        }
        .ready {
            color: #2e7d32;
        }
        .not-ready {
            color: #d32f2f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>외출 준비물 체크</h1>
    
    <img src="photo.jpg" alt="가을 외출 준비" class="header-image">
    
    <div class="checklist" id="checklist">
        <!-- 초기 항목은 JS에서 로드됩니다 -->
    </div>

    <div class="add-item-box">
        <input type="text" id="newItemInput" placeholder="추가할 물건 입력" onkeypress="handleKeyPress(event)">
        <button onclick="addNewItem()">추가</button>
    </div>

    <div class="btn-group">
        <button onclick="checkItems()">준비 확인</button>
        <button onclick="uncheckAll()" class="reset-btn">전체 해제</button>
    </div>
    
    <div id="message"></div>
</div>

<script>
    const initialItems = ['휴대전화', '지갑', '물병', '우산'];

    window.onload = function() {
        initialItems.forEach(item => addItemToDOM(item));
    }

    function checkItems() {
        const checkboxes = document.querySelectorAll('.item');
        const messageDiv = document.getElementById('message');
        
        if (checkboxes.length === 0) {
            messageDiv.textContent = "체크할 준비물이 없습니다.";
            messageDiv.className = "not-ready";
            return;
        }

        let allChecked = true;

        checkboxes.forEach(function(checkbox) {
            if (checkbox.checked === false) {
                allChecked = false;
            }
        });

        if (allChecked) {
            messageDiv.textContent = "준비 완료!";
            messageDiv.className = "ready";
        } else {
            messageDiv.textContent = "아직 챙기지 않은 물건이 있습니다.";
            messageDiv.className = "not-ready";
        }
    }

    function uncheckAll() {
        const checkboxes = document.querySelectorAll('.item');
        checkboxes.forEach(function(checkbox) {
            checkbox.checked = false; 
        });
        
        document.getElementById('message').textContent = "";
    }

    function addNewItem() {
        const inputField = document.getElementById('newItemInput');
        const itemName = inputField.value.trim(); 

        if (itemName === "") {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = "추가할 준비물 이름을 적어주세요!";
            messageDiv.className = "not-ready";
            return;
        }

        addItemToDOM(itemName);

        inputField.value = "";
        document.getElementById('message').textContent = "";
    }

    function addItemToDOM(itemName) {
        const checklistDiv = document.getElementById('checklist');
        
        const itemContainer = document.createElement('div');
        itemContainer.className = 'item-container';

        const newLabel = document.createElement('label');
        const newCheckbox = document.createElement('input');
        newCheckbox.type = 'checkbox';
        newCheckbox.className = 'item';
        
        newLabel.appendChild(newCheckbox);
        newLabel.appendChild(document.createTextNode(" " + itemName));
        
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '삭제';
        deleteBtn.className = 'delete-btn';
        deleteBtn.onclick = function() {
            checklistDiv.removeChild(itemContainer);
            document.getElementById('message').textContent = "";
        };

        itemContainer.appendChild(newLabel);
        itemContainer.appendChild(deleteBtn);

        checklistDiv.appendChild(itemContainer);
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            addNewItem();
        }
    }
</script>

</body>
</html>
